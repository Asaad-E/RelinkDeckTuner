[RelinkDeckTuner]
; Scale, BaseScale, Upscaler, DialogueVegetationLod and DialogueLodBias can also be changed in the
; game: Options > Graphics, last five rows (needs the menu data mod of the package). Apply saves
; them here.
; 0 = off (only logs), 1 = Scale during dialogues/cutscenes and BaseScale elsewhere, 2 = Scale always
Mode = 1
; 3D resolution scale per axis while active (0.4 - 1.0). 0.8 = 64% of the pixels.
Scale = 0.8
; 3D scale outside dialogues in Mode 1 (1.0 = native). The same upscaler is used.
BaseScale = 1.0
; Hotkeys (Windows virtual-key codes, 0 = off). Each press goes to the next step
; 1.0 -> 0.95 -> 0.9 -> 0.85 -> 0.8 -> 0.75 -> 1.0 and saves the value in this file.
; 120 = F9 (BaseScale), 121 = F10 (Scale in dialogues). On the Deck, map them to back buttons.
HotkeyBaseScale = 120
HotkeyDialogueScale = 121
; Which resolution pair to scale:
;   1 = 3D scene only (UI and text stay sharp)  <- recommended
;   2 = UI/output only (no performance gain)
;   3 = both (everything blurry, UI included)
Fields = 1
; How the lowered 3D image is stretched back to the screen (read once at game start):
;   3 = bicubic + AMD FidelityFX RCAS sharpening (close to native, no steps on outlines)  <- recommended
;   2 = bicubic (softer)
;   0 = the game's own temporal upsampler (leaves horizontal bands at non-integer scales)
; (1 = FSR 1.0 EASU until 0.13; it turned thin outlines into steps at 85-95 %, now means 3.)
Upscaler = 3
; Scenery LOD factor while a dialogue is on screen (1.0 = unchanged). Lower values make scenery
; models pick lighter LODs (0.5 = about +5-10% FPS in tests, hay bales visibly simpler at 0.3).
; Instanced vegetation is not affected (that is what the foliage data mod does).
DialogueLodBias = 1.0
; Extra LOD factor for vegetation only, while a dialogue is on screen (1.0 = unchanged, 0 = lowest
; LOD). Works on the vegetation models of the foliage data mod (marked by their LOD thresholds).
; Menu: Normal = 1.0, Light = 0.3, Reduced = 0.05 (looks almost the same, +7 to +12 FPS in tests), Minimum = 0.
; Scenery (DialogueLodBias): Normal = 1.0, Reduced = 0.3, Minimum = 0.1.
DialogueVegetationLod = 0.05
; Dialogue is considered over after this many ms without cutscene-camera updates
ExitDelayMs = 700
; Periodic state line in the .log (ms, includes fps and dialogueFps); 0 = only on changes
LogPeriodMs = 2000

; Saved alternative (tested 2026-11-02, not in use): always-on 3D scaling, no flicker
; except once at startup. 0.8 looked too low, 0.9/0.95 acceptable but with little gain:
;   Mode = 2
;   Scale = 0.95
;   Fields = 1
