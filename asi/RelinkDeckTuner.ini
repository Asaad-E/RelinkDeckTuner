[RelinkDeckTuner]
; 0 = off (only logs), 1 = lower the 3D resolution only during dialogues/cutscenes, 2 = always
Mode = 1
; 3D resolution scale per axis while active (0.4 - 1.0). 0.85 = 72% of the pixels.
Scale = 0.85
; Which resolution pair to scale:
;   1 = 3D scene only (UI and text stay sharp)  <- recommended
;   2 = UI/output only (no performance gain)
;   3 = both (everything blurry, UI included)
Fields = 1
; Dialogue is considered over after this many ms without cutscene-camera updates
ExitDelayMs = 700
; Periodic state line in the .log (ms); 0 = only on changes
LogPeriodMs = 2000

; Saved alternative (tested 2026-11-02, not in use): always-on 3D scaling, no flicker
; except once at startup. 0.8 looked too low, 0.9/0.95 acceptable but with little gain:
;   Mode = 2
;   Scale = 0.95
;   Fields = 1
