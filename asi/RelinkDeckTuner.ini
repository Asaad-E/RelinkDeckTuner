[RelinkDeckTuner]
; 0 = off (only logs), 1 = lower resolution only during dialogues/cutscenes, 2 = always (testing)
Mode = 0
; Resolution scale per axis while active (0.4 - 1.0). 0.75 = 56% of the pixels.
